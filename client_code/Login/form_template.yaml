components:
- components:
  - layout_properties: {grid_position: 'AKQBSQ,DNLEKU'}
    name: label_title
    properties: {align: center, bold: true, role: title, text: Sign in}
    type: Label
  - layout_properties: {grid_position: 'VPYOTS,PEEWDN'}
    name: label_email
    properties: {bold: true, text: Email}
    type: Label
  - layout_properties: {grid_position: 'NXAXXF,ULCQUJ'}
    name: email
    properties: {placeholder: you@example.com, type: email}
    type: TextBox
  - layout_properties: {grid_position: 'IYWUBN,EFHBZH'}
    name: label_password
    properties: {bold: true, text: Password}
    type: Label
  - layout_properties: {grid_position: 'BKJLYM,DMRBVI'}
    name: password
    properties: {hide_text: true}
    type: TextBox
  - layout_properties: {grid_position: 'YLFSOI,IBVBHE'}
    name: label_password_confirm
    properties: {bold: true, text: Confirm password, visible: false}
    type: Label
  - layout_properties: {grid_position: 'CAEXUA,IGCHRO'}
    name: password_confirm
    properties: {hide_text: true, visible: false}
    type: TextBox
  - layout_properties: {grid_position: 'DZGQCS,OFYQOQ'}
    name: check_box_remember
    properties: {checked: true, text: Remember me}
    type: CheckBox
  - event_bindings: {click: primary_action_click}
    layout_properties: {grid_position: 'WOVBWM,YGQFGV'}
    name: primary_action
    properties: {role: filled, text: Sign in}
    type: Button
  - event_bindings: {click: button_test_smtp_click}
    layout_properties: {grid_position: 'XQSPYV,ILJKQH'}
    name: button_test_smtp
    properties: {text: Test SMTP, visible: true}
    type: Button
  - event_bindings: {click: link_forgot_password_click}
    layout_properties: {grid_position: 'TLYXFY,NJBZDG'}
    name: link_forgot_password
    properties:
      align: center
      text: "Forgot your password?"
    type: Link
  - event_bindings: {click: link_toggle_mode_click}
    layout_properties: {grid_position: 'SJDMOH,GXBZUQ'}
    name: link_toggle_mode
    properties:
      align: center
      text: "Need an account? Sign up"
    type: Link
  layout_properties: {grid_position: 'EUDUQC,IKMBWM'}
  name: card_1
  properties: {col_widths: '{}', role: card}
  type: ColumnPanel
container:
  properties: {col_widths: '{}'}
  type: ColumnPanel
is_package: true
